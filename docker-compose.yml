services:
  web:
    build:
      context: .
    platform: linux/amd64
    image: mini-compilador-cpp:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MAX_CONCURRENT: "4"
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
